[databases]
innovation_dashboard = host=postgres port=5432 dbname=innovation_dashboard

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
default_pool_size = 20
max_client_conn = 200
log_connections = 1
log_disconnections = 1
